spring.application.name=transitflow

# ---------- Server ----------
server.port=${PORT:8080}
# ---------- Database (values come from environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transitflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:transitflow_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Logging ----------
logging.level.com.naveen.transitflow=INFO


# ---------- JWT ----------
# JWT_SECRET must be at least 32 characters. No default on purpose.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Seeded admin account (created on first startup) ----------
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@transitflow.com}
app.admin.phone=${ADMIN_PHONE:9999999999}
app.admin.password=${ADMIN_PASSWORD}

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Booking rules ----------
app.booking.hold-minutes=${HOLD_MINUTES:5}
app.booking.cancellation-cutoff-hours=${CANCELLATION_CUTOFF_HOURS:2}

# ---------- Scheduler ----------
app.scheduler.hold-expiry-delay-ms=${HOLD_EXPIRY_DELAY_MS:30000}
# ---------- Driver rules ----------
# A driver may start a trip this many minutes before its departure time.
app.driver.start-window-minutes=${DRIVER_START_WINDOW_MINUTES:60}

# ---------- Demo data (off by default) ----------
app.demo-data.enabled=${DEMO_DATA:false}